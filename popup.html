<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  :root {
    --ink: #14161C;
    --panel: #1B1E27;
    --paper: #EDEAE2;
    --muted: #9A9CAA;
    --rule: #2B2F3B;
    --accent: #E8B339;
    --high: #E1544C;
    --moderate: #E8A33D;
    --low: #5B8DEF;
    --font-display: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --font-mono: ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 360px;
    background: var(--ink);
    padding: 16px;
  }
  .app__header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--rule);
  }
  .app__mark {
    width: 30px; height: 30px;
    border-radius: 6px;
    background: var(--accent);
    color: var(--ink);
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .app__title {
    font-family: var(--font-display);
    font-size: 15px;
    margin: 0;
    color: var(--paper);
    font-weight: 700;
  }
  .app__subtitle {
    font-family: var(--font-body);
    font-size: 11px;
    color: var(--muted);
    margin: 2px 0 0;
  }
  .dial-wrap {
    position: relative;
    width: 132px; height: 132px;
    margin: 18px auto 6px;
  }
  .dial { width: 132px; height: 132px; transform: rotate(-90deg); }
  .dial__track { fill: none; stroke: var(--rule); stroke-width: 8; }
  .dial__fill {
    fill: none;
    stroke: var(--low);
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset .6s ease, stroke .3s ease;
  }
  .dial__center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .dial__score {
    font-family: var(--font-display);
    font-size: 34px;
    color: var(--paper);
    line-height: 1;
  }
  .dial__label {
    font-family: var(--font-body);
    font-size: 10px;
    letter-spacing: .12em;
    font-weight: 600;
    color: var(--muted);
    margin-top: 4px;
  }
  .findings {
    margin-top: 12px;
    max-height: 300px;
    overflow-y: auto;
    padding-right: 2px;
  }
  .findings::-webkit-scrollbar { width: 6px; }
  .findings::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }
  .finding {
    padding: 10px 0;
    border-bottom: 1px solid var(--rule);
  }
  .finding:last-child { border-bottom: none; }
  .finding__meta {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 4px;
  }
  .finding__dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  }
  .dot--high { background: var(--high); }
  .dot--moderate { background: var(--moderate); }
  .dot--low { background: var(--low); }
  .finding__category {
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--paper);
  }
 .finding__excerpt {
    font-family: var(--font-body);
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--muted);
    margin: 0;
    padding-left: 13px;
    border-left: 2px solid var(--rule);
}
  .empty-state {
    font-family: var(--font-body);
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    padding: 24px 10px;
  }
</style>
</head>
<body>
  <div class="app__header">
    <div class="app__mark">§</div>
    <div>
      <p class="app__title">Policy Scan</p>
      <p class="app__subtitle" id="subtitle">Reading the fine print…</p>
    </div>
  </div>

  <div class="dial-wrap">
    <svg class="dial" viewBox="0 0 120 120">
      <circle class="dial__track" cx="60" cy="60" r="52"/>
      <circle class="dial__fill" id="dialFill" cx="60" cy="60" r="52"/>
    </svg>
    <div class="dial__center">
      <span class="dial__score" id="scoreNum">–</span>
      <span class="dial__label" id="scoreLabel">SCANNING</span>
    </div>
  </div>

  <div class="findings" id="findings"></div>

  <script src="rules.js"></script>
  <script src="popup.js"></script>
</body>
</html>
